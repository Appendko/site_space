<html>
<head>
  <meta charset="UTF-8">
  <title>灑滿螺絲</title>
  <style>
    .negi{
        position:fixed;
        top:0;
        z-index:999;
        transition: left 0.1s linear,
                    top 0.1s linear;
        -webkit-animation: spin 14s infinite;
        animation: spin 5s infinite;
    }
    @-webkit-keyframes spin {
        100% {
            -webkit-transform: rotate(360deg);
        }
    }
    @keyframes spin {
        100% {
            -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
    }
</style>
</head>
